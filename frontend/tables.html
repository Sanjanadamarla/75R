<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>
    <table border="2px solid" cellspacing="0px" cellpadding="10px">
        <tr>
            <th>Student Name</th>
            <th>Branch</th>
        </tr>
        <tr>
            <td>Varun</td>
            <td>CSE</td>
        </tr>
        <tr>
            <td>Sanjay</td>
            <td>IT</td>
        </tr>
    </table>
    <br><br><br><br>
    <table border="2px solid" height="200px" width="400px">
        <caption>Create Tables in HTML</caption>
        <tr style="text-align: center">
            <td>Column 1</td>
            <td>Column 2</td>
            <td>Column 3</td>
        </tr>
        <tr style="text-align: center">
            <td rowspan="2">Row 1 Cell1</td>
            <td>Row 1 Cell2</td>
            <td>Row 1 Cell3</td>
        </tr>
        <tr style="text-align: center">
            <!--<td>Row 2 Cell1</td>-->
            <td>Row 2 Cell2</td>
            <td>Row 2 Cell3</td>
        </tr>
        <tr>
            <td colspan="3">Row 3 Cell1</td>
            <!--<td>Row 3 Cell2</td>
            <td>Row 3 Cell3</td>-->
        </tr>
    </table>



</body>
</html>
